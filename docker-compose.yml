services:
  dispatcher:
    build:
      context: .
      dockerfile: docker/dispatcher/Dockerfile
    tty: True
    restart: on-failure
    volumes:
      - ~/.local/share/gkfeed/data:/data
    env_file:
      - .env
    # only for dev
    environment:
      - BROKER_URL=${BROKER_URL:-http://host.docker.internal:8000}
      - REDIS_HOST=redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
  worker_light:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: ["worker_light"]
    tty: True
    restart: on-failure
    volumes:
      - ~/.local/share/gkfeed/data:/data
      - ${WORKER_LOG_DIR:-~/.local/share/gkfeed/logs}:/logs
    env_file:
      - .env
    environment:
      - BROKER_URL=${BROKER_URL:-http://host.docker.internal:8000}
      - REDIS_HOST=redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
  worker_heavy:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: ["worker_heavy"]
    tty: True
    restart: on-failure
    volumes:
      - ~/.local/share/gkfeed/data:/data
      - ${WORKER_LOG_DIR:-~/.local/share/gkfeed/logs}:/logs
    env_file:
      - .env
    environment:
      - BROKER_URL=${BROKER_URL:-http://host.docker.internal:8000}
      - REDIS_HOST=redis
      - SELENIUM_DOCKER_URL=http://chrome:4444
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - chrome
  # should be in services/redis.compose
  redis:
    image: redis:alpine
    restart: always
  # should be in services/chrome.compose
  chrome:
    image: selenium/standalone-chrome:latest
    restart: always
    environment:
      # Clean up browser processes left behind by interrupted Selenium sessions.
      - SE_ENABLE_BROWSER_LEFTOVERS_CLEANUP=true
      - SE_BROWSER_LEFTOVERS_INTERVAL_SECS=300
      - SE_BROWSER_LEFTOVERS_PROCESSES_SECS=900
      - SE_BROWSER_LEFTOVERS_TEMPFILES_DAYS=0
    tmpfs:
      # Chrome profiles are disposable. Keep them out of Docker's writable layer
      # and cap their aggregate size if an interrupted session leaks a profile.
      - /tmp:size=4g,mode=1777
    volumes:
      - /dev/shm:/dev/shm
